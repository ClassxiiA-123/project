<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISRO AI Mission Control</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #0b1026;
            color: white;
            padding: 50px 20px;
        }
        h1 {
            color: #55c8ff;
        }
        .box {
            max-width: 600px;
            margin: 30px auto;
            padding: 25px;
            background: #19264a;
            border-radius: 15px;
        }
        button {
            padding: 12px 24px;
            background: #1688e8;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>🚀 ISRO AI Mission Control</h1>

    <div class="box">
        <h2>Welcome to Mission Control</h2>
        <p>AI-Based Space Mission Analysis</p>
        <p>Your mission dashboard is ready!</p>
        <button onclick="alert('Mission Control is working!')">
            Test Dashboard
        </button>
    </div>
</body>
</html>
